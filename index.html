async function setupPush(){

function classifyAlert(score,metrics,sensitivity){

function quickAlertAnalysis(x,arr){

async function loadNews(name,symbol){
  // V8.4: use multiple established crypto RSS feeds through RSS2JSON.
  // This works when index.html is opened directly on iPhone and does not
  // require a backend or a paid API key.
  const feeds=[
    ["CoinDesk","https://www.coindesk.com/arc/outboundfeeds/rss/"],
    ["Cointelegraph","https://cointelegraph.com/rss"],
    ["Decrypt","https://decrypt.co/feed"],
    ["CryptoSlate","https://cryptoslate.com/feed/"],
    ["NewsBTC","https://www.newsbtc.com/feed/"]
  ];

  const clean=s=>(s||"").toLowerCase()
    .replace(/<[^>]*>/g," ")
    .replace(/[^a-z0-9$ ]/g," ")
    .replace(/\s+/g," ").trim();

  const assetName=clean(name);
  const assetSymbol=clean(symbol).replace(/^\$/,"");

  // Common project-specific aliases. These are deliberately limited to
  // identity terms for the clicked asset, not broad crypto keywords.
  const aliases={
    xrp:["ripple","xrp ledger","xrpl"],
    btc:["bitcoin"],
    eth:["ethereum","ether"],
    sol:["solana"],
    ada:["cardano"],
    doge:["dogecoin"],
    dot:["polkadot"],
    link:["chainlink"],
    avax:["avalanche"],
    qnt:["quant"],
    zec:["zcash"],
    ondo:["ondo finance"],
    edel:["edel"]
  };
  const terms=[assetName,assetSymbol,...(aliases[assetSymbol]||[])].filter(Boolean);

  const isRelevant=item=>{
    const hay=clean((item.title||"")+" "+(item.description||"")+" "+(item.content||""));
    return terms.some(term=>{
      if(term.length<=3) return new RegExp(`(^|\\s)\\$?${term.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")}(\\s|$)`,"i").test(hay);
      return hay.includes(term);
    });
  };

  const parseFeed=async([source,rss])=>{
    const endpoint=`https://api.rss2json.com/v1/api.json?rss_url=${encodeURIComponent(rss)}`;
    try{
      const r=await fetch(endpoint,{cache:"no-store"});
      if(!r.ok) return [];
      const d=await r.json();
      if(d.status!=="ok" || !Array.isArray(d.items)) return [];
      return d.items.filter(isRelevant).map(a=>({
        title:a.title||"Untitled",
        link:a.link||"#",
        pub:a.pubDate||"",
        source
      }));
    }catch(e){ return []; }
  };

  const batches=await Promise.all(feeds.map(parseFeed));
  const all=batches.flat();

  // Deduplicate repeated syndicated headlines.
  const seen=new Set();
  const unique=all.filter(a=>{
    const key=clean(a.title);
    if(!key || seen.has(key)) return false;
    seen.add(key); return true;
  });

  unique.sort((a,b)=>{
    const ta=Date.parse(a.pub)||0, tb=Date.parse(b.pub)||0;
    return tb-ta;
  });

  return unique.slice(0,8);
}
